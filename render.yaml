services:
  - type: web
    name: courier-parcel-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string (mongodb+srv://...)
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Frontend URL(s), comma-separated, e.g. https://courier-parcel-frontend.onrender.com
      - key: CLIENT_URL
        sync: false
      # Optional: Gmail address + app password for parcel status emails
      - key: NODEMAILER_EMAIL
        sync: false
      - key: NODEMAILER_PASS
        sync: false

  - type: web
    name: courier-parcel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Backend URL, e.g. https://courier-parcel-api.onrender.com (read at build time)
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
