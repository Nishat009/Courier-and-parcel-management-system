services:
  - type: web
    name: courier-parcel-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://YOUR-FRONTEND.onrender.com

  - type: web
    name: courier-parcel-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://YOUR-BACKEND.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
